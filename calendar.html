<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compliance & Calendar Desk | HexaTP</title>
<meta name="description" content="Internal transfer pricing and income tax compliance calendar covering deadlines, national holidays, and events across HexaTP's jurisdictions.">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin:0;
    padding:0;
    background:#EDEAE0;
    min-height:100vh;
    font-family: 'Poppins', sans-serif;
  }
  body {
    padding:28px 16px;
    box-sizing:border-box;
  }
  .tpc-page-wrap {
    max-width:900px;
    margin:0 auto;
    background:#F5F2EA;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(11,31,58,.12);
  }
  @media (max-width:640px){
    body { padding:0; }
    .tpc-page-wrap { border-radius:0; box-shadow:none; }
  }
  :root{
    --navy-deep:#0B1F3A;
    --navy-mid:#14335C;
    --navy-line:#26456F;
    --paper:#F5F2EA;
    --paper-panel:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5C6577;
    --gold:#C89B3C;
    --gold-soft:#E9D8AE;
    --c-tp:#C89B3C;
    --c-tax:#2F6F76;
    --c-fest:#7A6FB0;
    --c-event:#3E7C59;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  .tpc-root{
    background-color:var(--paper);
    background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22260%22%20height%3D%22140%22%3E%0A%3Ctext%20x%3D%2210%22%20y%3D%2240%22%20font-family%3D%22Georgia%2C%20serif%22%20font-size%3D%2222%22%20font-weight%3D%22700%22%0A%20%20fill%3D%22%230B1F3A%22%20fill-opacity%3D%220.035%22%20transform%3D%22rotate%28-18%2010%2040%29%22%3EHexaTP%3C/text%3E%0A%3Ctext%20x%3D%22140%22%20y%3D%22110%22%20font-family%3D%22Georgia%2C%20serif%22%20font-size%3D%2222%22%20font-weight%3D%22700%22%0A%20%20fill%3D%22%230B1F3A%22%20fill-opacity%3D%220.035%22%20transform%3D%22rotate%28-18%20140%20110%29%22%3EHexaTP%3C/text%3E%0A%3C/svg%3E");
    background-repeat:repeat;
    color:var(--ink);
    padding:0;
    min-height:100%;
    position:relative;
  }
  .tpc-hero{
    position:relative;
    background-image:linear-gradient(160deg, rgba(6,20,42,.90), rgba(15,40,74,.80)), url("hexa-logo-home.jpg");
    background-size: cover;
    background-position: center;
    padding: 60px 40px;
    text-align: center;
    color: white;
  }
  .tpc-hero h1 {
    margin: 0;
    font-size: 32px;
  }
</style>
</head>
<body>
<div class="tpc-page-wrap">
  <div class="tpc-root">
    <div class="tpc-hero">
      <h1>Compliance & Calendar Desk</h1>
      <p style="color: #cbd5e1; margin-top: 10px;">Internal transfer pricing and income tax compliance calendar</p>
    </div>
    <div style="padding: 40px; text-align: center; min-height: 400px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
      <h2 style="color: var(--navy-mid);">Calendar Module</h2>
      <p style="color: var(--ink-soft); max-width: 600px; margin-top: 15px;">
        Note: The full HTML code provided for the calendar was truncated in the prompt. You can insert the complete calendar code in this section of the <strong>calendar.html</strong> file.
      </p>
      <a href="login.html" style="margin-top: 30px; display: inline-block; padding: 12px 24px; background: var(--gold); color: white; text-decoration: none; border-radius: 8px; font-weight: 600;">Back to Portal</a>
    </div>
  </div>
</div>
</body>
</html>
